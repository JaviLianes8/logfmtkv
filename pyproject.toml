[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logfmtkv"
version = "0.2.1"
description = "Typed, zero-dependency logfmt codec: parse and serialize key=value log lines in both directions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["logfmt", "logging", "key-value", "parser", "serializer", "structured-logging", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
    "Topic :: Text Processing",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
logfmtkv = "logfmtkv._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/logfmtkv"
Issues = "https://github.com/JaviLianes8/logfmtkv/issues"
Changelog = "https://github.com/JaviLianes8/logfmtkv/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md", "CONTRIBUTING.md"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/logfmtkv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
